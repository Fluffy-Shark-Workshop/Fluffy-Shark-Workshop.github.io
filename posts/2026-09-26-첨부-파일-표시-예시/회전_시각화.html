<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회전 행렬 시각화</title>
<style>
  :root { --ink: #1d3b8b; --red: #c82d2d; --line: #e3e7ec; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px 32px 36px; font: 16px/1.7 "Pretendard", "Malgun Gothic", system-ui, sans-serif; color: #1f2328; background: #fff; }
  h1 { margin: 0 0 6px; font-size: 22px; }
  p { margin: 0 0 18px; color: #59636e; }
  .wrap { display: grid; grid-template-columns: minmax(280px, 520px) 1fr; gap: 28px; align-items: start; }
  svg { width: 100%; height: auto; border: 1px solid var(--line); border-radius: 12px; background: #fcfdff; }
  .panel { padding: 18px 20px; border: 1px solid var(--line); border-radius: 12px; }
  label { display: block; margin-bottom: 8px; font-weight: 600; }
  input[type=range] { width: 100%; }
  table { margin-top: 14px; border-collapse: collapse; font: 18px/1.4 ui-monospace, Consolas, monospace; }
  td { padding: 6px 14px; border-left: 2px solid #1f2328; border-right: 2px solid #1f2328; text-align: right; }
  td + td { border-left: 0; }
  .vec { margin-top: 16px; font-family: ui-monospace, Consolas, monospace; }
  .vec b { color: var(--red); }
  @media (max-width: 700px) { .wrap { grid-template-columns: 1fr; } body { padding: 18px; } }
</style>
</head>
<body>
<h1>회전 행렬 R(θ) 직접 돌려 보기</h1>
<p>슬라이더로 각도를 바꾸면 파란 벡터 v = (4, 8)이 빨간 벡터 Rv로 돌아갑니다. 이 파일은 블로그 본문에 iframe으로 들어가며, 높이가 자동으로 맞춰집니다.</p>
<div class="wrap">
  <svg viewBox="-12 -12 24 24" role="img" aria-label="회전 전후 벡터">
    <g stroke="#e3e7ec" stroke-width="0.05">
      <path id="grid"></path>
    </g>
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#8b949e" stroke-width="0.08"/>
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#8b949e" stroke-width="0.08"/>
    <circle cx="0" cy="0" r="8.944" fill="none" stroke="#c9d1d9" stroke-width="0.06" stroke-dasharray="0.3 0.3"/>
    <line id="v" x1="0" y1="0" x2="4" y2="-8" stroke="#1d3b8b" stroke-width="0.28" stroke-linecap="round"/>
    <line id="rv" x1="0" y1="0" x2="4" y2="-8" stroke="#c82d2d" stroke-width="0.28" stroke-linecap="round"/>
  </svg>
  <div class="panel">
    <label for="theta">θ = <span id="deg">36.87</span>°</label>
    <input id="theta" type="range" min="-180" max="180" step="0.01" value="36.87">
    <table aria-label="회전 행렬 값">
      <tr><td id="a">0.800</td><td id="b">-0.600</td></tr>
      <tr><td id="c">0.600</td><td id="d">0.800</td></tr>
    </table>
    <div class="vec">v = (4.00, 8.00)<br>Rv = <b id="out">(-1.60, 8.80)</b><br>|Rv|² = <span id="len">80.00</span></div>
  </div>
</div>
<script>
  const grid = [];
  for (let i = -12; i <= 12; i += 1) grid.push(`M${i} -12V12M-12 ${i}H12`);
  document.getElementById('grid').setAttribute('d', grid.join(''));
  const slider = document.getElementById('theta');
  const update = () => {
    const deg = parseFloat(slider.value);
    const t = (deg * Math.PI) / 180;
    const c = Math.cos(t), s = Math.sin(t);
    const x = c * 4 - s * 8, y = s * 4 + c * 8;
    document.getElementById('deg').textContent = deg.toFixed(2);
    document.getElementById('a').textContent = c.toFixed(3);
    document.getElementById('b').textContent = (-s).toFixed(3);
    document.getElementById('c').textContent = s.toFixed(3);
    document.getElementById('d').textContent = c.toFixed(3);
    document.getElementById('out').textContent = `(${x.toFixed(2)}, ${y.toFixed(2)})`;
    document.getElementById('len').textContent = (x * x + y * y).toFixed(2);
    const rv = document.getElementById('rv');
    rv.setAttribute('x2', x);
    rv.setAttribute('y2', -y);
  };
  slider.addEventListener('input', update);
  update();
</script>
</body>
</html>
